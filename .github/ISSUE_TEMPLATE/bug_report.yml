name: Bug report
description: Report a reproducible problem without sharing private finance data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve HushLedger. Remove all real financial data, account identifiers, and secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main at abc1234
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Dashboard
        - Transactions
        - Recurring transactions
        - Cloudflare Worker or D1
        - PWA installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, operating system, and local or Cloudflare deployment.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real financial data, account numbers, tokens, API keys, and personal information.
          required: true
