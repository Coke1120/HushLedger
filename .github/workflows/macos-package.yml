name: macOS package

on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      HUSHLEDGER_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use standalone Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          architecture: arm64
          cache: npm

      - name: Verify Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"

      - name: Install locked dependencies
        run: npm ci

      - name: Test and check source
        run: |
          npm test
          npm run test:macos
          npm run typecheck
          npm run lint

      - name: Build and sign local preview
        run: npm run package:macos

      - name: Archive application and record checksums
        run: npm run archive:macos

      - name: Launch archived app with a disposable synthetic ledger
        run: npm run smoke:macos

      - name: Retain macOS downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HushLedger-macos-arm64-${{ github.sha }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
            dist/macos/*.build.json
            dist/macos/*.README.txt
          if-no-files-found: error
          retention-days: 14
