name: macOS package

on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      HUSHLEDGER_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag and current main source
        if: github.ref_type == 'tag'
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 scripts/release-macos.py source --tag "$RELEASE_TAG"

      - name: Use standalone Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          architecture: arm64
          cache: npm

      - name: Verify Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"

      - name: Install locked dependencies
        run: npm ci

      - name: Test and check source
        run: |
          umask 022
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release-macos.test.py
          npm run verify
          npm run test:macos

      - name: Build and sign local preview
        run: npm run package:macos

      - name: Archive application and record checksums
        run: npm run archive:macos

      - name: Launch archived app with a disposable synthetic ledger
        run: npm run smoke:macos

      - name: Validate the actual release app ZIP and provenance
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.source_sha }}
        run: python3 scripts/release-macos.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

      - name: Retain macOS downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HushLedger-macos-arm64-${{ github.sha }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
            dist/macos/*.build.json
            dist/macos/*.README.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - name: Check out the exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false

      - name: Download the verified app and sidecars
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: HushLedger-macos-arm64-${{ github.sha }}
          path: dist/macos

      - name: Upload, download-check and publish the complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.source_sha }}
        run: python3 scripts/release-macos.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
